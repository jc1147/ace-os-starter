<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory sitemap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120d22'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23a78bfa'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23120d22'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('sitemap-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="stylesheet" href="./sitemap.css">
</head>
<body>
<header id="top">
  <div class="wrap">
    <a class="brand" href="#/" title="All sections">
      <span class="mark" aria-hidden="true"></span>
      <span><h1>Memory sitemap</h1><small id="sub">Everything Claude remembers, by section</small></span>
    </a>
    <div class="search" role="search">
      <label for="q">
        <span class="q">What do I know about</span>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="..." aria-label="What do I know about" aria-controls="hits">
        <kbd>/</kbd>
      </label>
      <div id="hits" role="listbox"></div>
    </div>
    <div class="tools">
      <button class="btn" id="theme" type="button" title="Switch light and dark">Light</button>
      <a class="btn" href="/" title="Back to Mission Control">Dashboard</a>
    </div>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"><p class="empty">Loading the memory sitemap...</p></main>
<script src="./sitemap.js"></script>
</body>
</html>
